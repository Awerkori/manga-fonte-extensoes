name: Sync Upstream

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Origem do disparo (heartbeat, watchdog, manual)'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - heartbeat
          - watchdog
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Validate authentication & configure git push
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          echo "=================================================="
          echo "PROJECT NOX — AUTHENTICATION & CREDENTIAL GUARD"
          echo "=================================================="

          if [ -z "$SYNC_PAT" ]; then
            echo "::error title=Credencial Ausente::secrets.SYNC_PAT está ausente ou vazio."
            echo "O Personal Access Token é obrigatório para publicar em origin/main e disparar o workflow de compilação."
            exit 1
          fi

          AUTH_STATUS=$(curl -s -o /tmp/gh_auth_check.json -w "%{http_code}" \
            -H "Authorization: Bearer $SYNC_PAT" \
            -H "User-Agent: ProjectNox-SyncUpstream-AuthCheck" \
            https://api.github.com/user)

          if [ "$AUTH_STATUS" -eq 200 ]; then
            USER_LOGIN=$(jq -r '.login // empty' /tmp/gh_auth_check.json)
            echo "✅ Autenticação com SYNC_PAT verificada com sucesso (HTTP 200). Usuário: $USER_LOGIN"
          elif [ "$AUTH_STATUS" -eq 401 ]; then
            echo "::error title=Credencial Inválida::FALHA PERMANENTE: SYNC_PAT inválido ou expirado (HTTP 401: Bad credentials)."
            echo "Por favor, atualize o secret SYNC_PAT no repositório."
            rm -f /tmp/gh_auth_check.json
            exit 1
          elif [ "$AUTH_STATUS" -eq 403 ]; then
            echo "::warning title=Restrição de Rate Limit::Verificação da API retornou HTTP 403. Prosseguindo com cautela..."
          else
            echo "::warning title=Aviso de API::Verificação da API retornou HTTP $AUTH_STATUS."
          fi
          rm -f /tmp/gh_auth_check.json

          # Configura credenciais para push em origin com o PAT
          B64_AUTH=$(echo -n "x-access-token:${SYNC_PAT}" | base64 -w 0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${B64_AUTH}"
          echo "✅ Git configurado com SYNC_PAT para permitir acionamento de workflows downstream."

          # Validação antecipada (pre-flight probe) de permissão de escrita
          if ! git push --dry-run origin HEAD:main > /tmp/git_push_probe.log 2>&1; then
            echo "::error title=Permissão de Escrita Insuficiente::FALHA PERMANENTE: SYNC_PAT não possui permissão de escrita/push no repositório."
            cat /tmp/git_push_probe.log
            rm -f /tmp/git_push_probe.log
            exit 1
          fi
          rm -f /tmp/git_push_probe.log
          echo "✅ Pré-validação de permissão de escrita (git push --dry-run) confirmada."

      - name: Watchdog guard & mode detection
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || 'manual' }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/pulse_guard.py --defer-transient watchdog-check

      - name: Configure Git
        if: steps.guard.conclusion == 'success' && steps.guard.outputs.should_run_sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        id: sync
        if: steps.guard.conclusion == 'success' && steps.guard.outputs.should_run_sync == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Sync upstream — Tentativa $attempt de $MAX_ATTEMPTS"
            SYNC_LOG="$(mktemp)"

            set +e
            python .github/scripts/sync-upstream.py --push 2>&1 | tee "$SYNC_LOG"
            EXIT_CODE="${PIPESTATUS[0]}"
            set -e

            echo "::endgroup::"

            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "Sincronização concluída com sucesso na tentativa $attempt."
              rm -f "$SYNC_LOG"
              exit 0
            fi

            echo "Tentativa $attempt falhou com código de saída $EXIT_CODE."

            # Determina se a falha é elegível para recuperação controlada
            RETRY_DECISION="NO_RETRY: Falha não elegível para repetição automática"

            if grep -q "Push origin/main: PASS" "$SYNC_LOG"; then
              RETRY_DECISION="NO_RETRY: Tentativa já publicada em origin/main"
            elif grep -q "DEDUPLICATED DETERMINISTIC FAILURE DETECTED" "$SYNC_LOG"; then
              RETRY_DECISION="NO_RETRY: Falha determinística já diagnosticada"
            elif grep -q "BLOCKED_STRUCTURAL" "$SYNC_LOG"; then
              RETRY_DECISION="NO_RETRY: Bloqueio estrutural de API ou core"
            elif grep -q -E "origin/main advanced during sync|HEAD is not based on the fetched origin/main|Updates were rejected because the remote contains work that you do not have locally|\[rejected\].*fetch first|\[rejected\].*non-fast-forward" "$SYNC_LOG"; then
              RETRY_DECISION="RETRY: origin/main avançou durante a sincronização"
            elif grep -q -E "(^e: .*:|[[:space:]]Compilation error[[:space:]])" "$SYNC_LOG"; then
              RETRY_DECISION="NO_RETRY: Falha real de compilação"
            elif grep -q "Structural compatibility validation failed:" "$SYNC_LOG"; then
              RETRY_DECISION="NO_RETRY: Incompatibilidade estrutural multisrc"
            elif grep -q "Local project dependency validation failed:" "$SYNC_LOG"; then
              RETRY_DECISION="NO_RETRY: Dependência de projeto local ausente"
            elif grep -q "Structural libVersion downgrade blocked" "$SYNC_LOG"; then
              RETRY_DECISION="NO_RETRY: Downgrade de libVersion bloqueado"
            elif grep -q "Unproven protected multisrc:" "$SYNC_LOG"; then
              RETRY_DECISION="NO_RETRY: Multisrc protegido não comprovado"
            elif grep -q -E "Permission to .* denied|fatal: Authentication failed|Authentication failed|fatal: could not read Username|status code:?[[:space:]]*(401|403)|Received status code (401|403)" "$SYNC_LOG"; then
              RETRY_DECISION="NO_RETRY: Falha de autenticação"
            elif grep -q -E "Plugin \[id: '.*'\] was not found|Script compilation error|status code:?[[:space:]]*404|Received status code 404" "$SYNC_LOG"; then
              RETRY_DECISION="NO_RETRY: Erro permanente de configuração ou dependência inexistente"
            elif grep -q -E "Could not download|Could not get resource|Could not GET|Could not HEAD|Could not resolve all files for configuration|Could not resolve dependencies|Downloading https?://" "$SYNC_LOG" && \
                 grep -q -E "Received status code (429|500|502|503|504)|status code:?[[:space:]]*(429|500|502|503|504)|(429|500|502|503|504) (Too Many Requests|Internal Server Error|Bad Gateway|Service Unavailable|Gateway Timeout)" "$SYNC_LOG"; then
              RETRY_DECISION="RETRY: Falha temporária no download de dependências"
            fi

            rm -f "$SYNC_LOG"

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "Limite de $MAX_ATTEMPTS tentativas atingido. Abortando execução."
              exit "$EXIT_CODE"
            fi

            case "$RETRY_DECISION" in
              RETRY:*)
                echo "Recuperação permitida: $RETRY_DECISION"
                echo "Restaurando estado limpo do runner e sincronizando origin/main..."
                ./gradlew --stop 2>/dev/null || true
                git merge --abort 2>/dev/null || true
                git fetch origin main
                git checkout -B main origin/main
                git reset --hard origin/main
                git clean -ffdx
                git worktree prune 2>/dev/null || true
                echo "Aguardando 10 segundos antes da próxima tentativa..."
                sleep 10
                ;;
              *)
                echo "Falha não elegível para nova tentativa: $RETRY_DECISION"
                exit "$EXIT_CODE"
                ;;
            esac
          done

      - name: Trigger next check (24/7 cloud pulse)
        if: always() && !cancelled() && steps.guard.conclusion == 'success' && steps.guard.outputs.should_run_sync == 'true' && steps.sync.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN: ${{ secrets.SYNC_PAT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || 'manual' }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/pulse_guard.py --defer-transient pulse-dispatch --sleep-seconds 300
